<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Cielorraso PVC – SECORED</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f0f;
            --surface: #181818;
            --surface2: #222222;
            --border: #2e2e2e;
            --accent: #c8f135;
            --accent2: #f1c435;
            --text: #e8e8e8;
            --muted: #666;
            --danger: #ff5c5c;
            --green: #16a085;
            --purple: #9b59b6;
            --mono: 'DM Mono', monospace;
            --display: 'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 980px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            margin-bottom: 40px;
        }
        .logo {
            font-family: var(--display);
            font-weight: 800;
            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }
        h1 {
            font-family: var(--display);
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 700;
            line-height: 1.1;
            color: var(--text);
        }
        h1 span { color: var(--accent); }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 28px;
            margin-bottom: 20px;
        }
        .card-title {
            font-family: var(--display);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 20px;
        }

        /* INPUT GROUP */
        .input-group {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 14px;
        }
        .field { margin-bottom: 0; }
        .field label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }
        input[type="text"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 3px;
            color: var(--text);
            font-family: var(--mono);
            font-size: 15px;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.15s;
            width: 260px;
        }
        input[type="text"]:focus { border-color: var(--accent); }

        .nota {
            font-size: 11px;
            color: var(--muted);
            align-self: flex-end;
            padding-bottom: 2px;
            max-width: 300px;
        }

        /* BUTTON */
        button {
            background: var(--accent);
            color: #0f0f0f;
            border: none;
            border-radius: 3px;
            font-family: var(--display);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 12px 22px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:hover { opacity: 0.88; transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button.active { 
            box-shadow: 0 0 0 2px var(--accent); 
        }

        /* ORIENTATION SELECTOR */
        .orientation-selector {
            display: none;
            margin-bottom: 20px;
        }
        .orientation-selector.visible { display: block; }
        .orientation-selector .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .orientation-selector button {
            flex: 1;
            min-width: 180px;
        }
        .btn-corto {
            background: var(--purple) !important;
            color: white !important;
        }
        .btn-largo {
            background: var(--danger) !important;
            color: white !important;
        }

        /* RESULTADOS GRID */
        .resultados {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .resultados .card {
            flex: 1 1 45%;
            min-width: 360px;
        }

        /* CARD RESULT HEADER */
        .card h2 {
            font-family: var(--display);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }
        .card h2.corto { color: var(--purple); }
        .card h2.largo { color: var(--danger); }

        /* CEILING INFO */
        .ceiling-info {
            background: var(--surface2);
            padding: 10px 14px;
            border-radius: 3px;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--muted);
        }
        .ceiling-info strong { color: var(--text); }

        /* MATERIAL LIST */
        .material-list {
            list-style: none;
            padding: 0;
        }
        .material-list li {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #1e1e1e;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.4;
        }
        .material-list li:last-child { border-bottom: none; }
        .material-list li strong {
            font-family: var(--display);
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            min-width: 42px;
            flex-shrink: 0;
        }
        .material-list li .cod {
            color: var(--accent);
            min-width: 50px;
        }

        /* WASTE */
        .waste {
            font-family: var(--display);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 14px;
            padding: 10px 14px;
            background: #161f00;
            border: 1px solid #2e4a00;
            border-radius: 3px;
            color: var(--accent);
        }

        /* OPTIONAL BUTTONS */
        .btn-opc {
            margin-top: 14px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-opc button {
            background: transparent;
            color: var(--accent2);
            border: 1px solid #3a3a00;
            font-size: 11px;
            padding: 8px 14px;
        }
        .btn-opc button:hover {
            background: #1a1a00;
            opacity: 1;
            transform: none;
        }

        /* OPCIONAL BLOCK */
        .opcional {
            margin-top: 12px;
        }
        .opcional h4 {
            font-family: var(--display);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .opcional .material-list {
            background: #161f00;
            border: 1px solid #2e4a00;
            border-radius: 3px;
            padding: 10px 14px;
        }

        /* TOTAL CONSOLIDADO */
        .total-consolidado {
            background: linear-gradient(135deg, #1a3a1a 0%, #0f2f0f 100%);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 28px;
            margin-top: 20px;
        }
        .total-consolidado h3 {
            font-family: var(--display);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(200, 241, 53, 0.3);
        }
        .total-consolidado .ceiling-info {
            background: rgba(200, 241, 53, 0.1);
            border: 1px solid rgba(200, 241, 53, 0.2);
        }
        .total-consolidado .ceiling-info strong { color: var(--accent); }
        .total-consolidado .material-list li {
            border-bottom-color: rgba(200, 241, 53, 0.1);
        }
        .total-consolidado .material-list li strong { color: var(--accent); }
        .total-consolidado .waste {
            background: rgba(200, 241, 53, 0.15);
            border-color: var(--accent);
        }

        /* MULTIPLE NOTICE */
        .multiple-notice {
            background: #2a2a00;
            border-left: 3px solid var(--accent2);
            padding: 10px 14px;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--accent2);
            border-radius: 0 3px 3px 0;
        }

        /* FOOTER */
        footer {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-top: 24px;
            padding: 14px;
            border: 1px dashed var(--border);
            border-radius: 3px;
        }
        footer strong { color: var(--accent); }

        /* NAV LINK */
        .nav-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            padding-bottom: 8px;
        }
        .nav-link a {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 2px;
            transition: color 0.15s, border-color 0.15s;
        }
        .nav-link a:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .resultados .card {
                flex: 1 1 100%;
                min-width: auto;
            }
            .input-group {
                flex-direction: column;
                align-items: stretch;
            }
            input[type="text"] {
                width: 100%;
            }
            .nota {
                align-self: flex-start;
                padding-top: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <header>
            <div class="logo">Secored · Sistema 2</div>
            <h1>Calculadora<br><span>Cielorraso PVC</span></h1>
        </header>

        <div class="card">
            <div class="card-title">Medidas del techo</div>
            <div class="input-group">
                <div class="field">
                    <label for="medidas">Medidas (largo × ancho)</label>
                    <input type="text" id="medidas" placeholder="Ej: 8*6 o 30*6+4*7" value="80*6">
                </div>
                <button id="calcular">Analizar medidas</button>
                <span class="nota">Use <strong>x, *, /</strong> para separar medidas. Use <strong>+ o -</strong> para múltiples cielorrasos.</span>
            </div>
        </div>

        <!-- Selector de orientación -->
        <div id="orientationSelector" class="card orientation-selector">
            <div class="card-title">Orientación de las tablas</div>
            <div class="btn-group">
                <button class="btn-corto" id="btnCorto">📐 Paralelo al lado CORTO</button>
                <button class="btn-largo" id="btnLargo">📏 Paralelo al lado LARGO</button>
            </div>
        </div>

        <div id="resultados" class="resultados">
            <!-- Se llena dinámicamente -->
        </div>

        <div id="totalConsolidado"></div>

        <footer>Las cantidades se redondean según normas del sistema. Los totales consolidados suman todos los cielorrasos.</footer>

    </div>

    <script>
        // ==================== DATOS Y CONSTANTES ====================
        const articulos = {
            '954': 'PVC 10MM BLANCO 0.2X4MTS',
            '955': 'PVC 10 MM BLANCO 0.2X5MTS',
            '956': 'PVC 10 MM BLANCO X 0.2X6 MTS',
            '953': 'PVC BORDE 10MM BLANCO X 3 MTS',
            '957': 'PVC 10MM UNION "H" BLANCO X 3 MTS',
            '545': 'SOLERAS 35 MM X 2,6 MTS',
            '67': 'MONTANTE 34 MM X 2,4 MTS',
            't8': 'TORNILLO FIX 8x1x3/4',
            '1157': 'TARUGO 6 mm SIN TOPE',
            't1': 'TORNILLO T1 AGUJA 8×9/16',
            '185': 'PVC AIS 200X10MM VALENCIA X 4 MTS',
            '186': 'PVC AIS 200X10MM VALENCIA X 6 MTS',
            '187': 'PVC AIS PERFIL F DE BORDE X 3 MTS',
            '1398': 'PVC AIS UNION H X 3 MTS',
            '876602': 'LANA KNAUF Earthwool 39 ALU 50 mm (24 m²)',
            '876604': 'LANA KNAUF Earthwool 39 ALU 70 mm (14,4 m²)'
        };

        // Estado global
        let estadoCalculo = {
            cielorrasos: [],
            orientacionSeleccionada: null,
            esMultiple: false
        };

        // ==================== FUNCIONES AUXILIARES ====================
        function roundUp50(num) {
            return Math.ceil(num / 50) * 50;
        }

        // Verifica si un número es entero
        function esEntero(num) {
            return num === Math.floor(num);
        }

        // ==================== CÁLCULOS BASE ====================
        
        /**
         * Calcula tablas y desperdicio según especificaciones
         * CORREGIDO: Mejor lógica para determinar cantidad de tablas
         */
        function calcularTablasYDesperdicio(largo, ancho, orientacion, C) {
            let N, reqLen;
            
            if (orientacion === 'corto') {
                // Tablas paralelas al lado más corto
                N = Math.ceil(largo / 0.2);  // Cantidad de tramos
                reqLen = ancho;               // Largo requerido por tramo = lado corto
            } else {
                // Tablas paralelas al lado más largo
                N = Math.ceil(ancho / 0.2);  // Cantidad de tramos
                reqLen = largo;               // Largo requerido por tramo = lado largo
            }

            let tables;
            if (reqLen <= C) {
                // La tabla alcanza para uno o más tramos
                let piezasPorTabla = Math.floor(C / reqLen);
                if (piezasPorTabla === 0) piezasPorTabla = 1;
                tables = Math.ceil(N / piezasPorTabla);
            } else {
                // Se necesita empalmar
                let tablasPorFila = Math.ceil(reqLen / C);
                tables = N * tablasPorFila;
            }

            let totalNeeded = N * reqLen;
            let totalBought = tables * C;
            let waste = totalBought - totalNeeded;
            
            return { tables, N, reqLen, waste, totalNeeded, totalBought, C };
        }

        /**
         * Determina el mejor largo comercial minimizando desperdicio
         */
        function mejorLargo(largo, ancho, orientacion, longitudesDisponibles) {
            let mejor = null;
            let menorDesperdicio = Infinity;
            let mejorResultado = null;

            for (let C of longitudesDisponibles) {
                const res = calcularTablasYDesperdicio(largo, ancho, orientacion, C);
                if (res.waste < menorDesperdicio || (res.waste === menorDesperdicio && C > (mejor || 0))) {
                    menorDesperdicio = res.waste;
                    mejor = C;
                    mejorResultado = res;
                }
            }
            return { C: mejor, ...mejorResultado };
        }

        /**
         * Cálculo de montantes CORREGIDO según especificaciones
         * Paralelo al CORTO: 
         *   Paso 1: LADO_CORTO/0.4 (si entero +1, si decimal redondear arriba +1)
         *   Paso 2: resultado × LADO_LARGO
         *   Paso 3: LADO_LARGO/1.2 (si entero -1, si decimal redondear abajo -1)
         *   Paso 4: resultado × LADO_CORTO
         * Paralelo al LARGO: (invertir lados)
         */
        function calcularMontantes(largo, ancho, orientacion) {
            let paso1, paso2, paso3, paso4;
            
            if (orientacion === 'corto') {
                // Tablas paralelas al lado CORTO
                let div1 = ancho / 0.4;
                paso1 = esEntero(div1) ? (div1 + 1) : (Math.ceil(div1) + 1);
                paso2 = paso1 * largo;
                
                let div3 = largo / 1.2;
                if (div3 < 2) {
                    paso3 = Math.max(0, Math.floor(div3) - 1);
                } else if (esEntero(div3)) {
                    paso3 = Math.max(0, div3 - 1);
                } else {
                    paso3 = Math.max(0, Math.floor(div3) - 1);
                }
                paso4 = paso3 * ancho;
            } else {
                // Tablas paralelas al lado LARGO
                let div1 = largo / 0.4;
                paso1 = esEntero(div1) ? (div1 + 1) : (Math.ceil(div1) + 1);
                paso2 = paso1 * ancho;
                
                let div3 = ancho / 1.2;
                if (div3 < 2) {
                    paso3 = Math.max(0, Math.floor(div3) - 1);
                } else if (esEntero(div3)) {
                    paso3 = Math.max(0, div3 - 1);
                } else {
                    paso3 = Math.max(0, Math.floor(div3) - 1);
                }
                paso4 = paso3 * largo;
            }
            
            return Math.ceil((paso2 + paso4) / 2.6);
        }

        /**
         * Cálculo de perfil H según especificaciones
         * Solo se calcula si reqLen > C (la tabla no alcanza)
         */
        function calcularPerfilH(largo, ancho, orientacion, C, reqLen) {
            if (reqLen <= C) return 0;
            
            // Segun especificaciones:
            // Paralelo al CORTO: lado LARGO / 3
            // Paralelo al LARGO: lado CORTO / 3
            if (orientacion === 'corto') {
                return Math.ceil(largo / 3);
            } else {
                return Math.ceil(ancho / 3);
            }
        }

        /**
         * Función principal de cálculo de materiales
         */
        function calcularMateriales(largo, ancho, orientacion, color = false) {
            let longitudes = color ? [4, 6] : [4, 5, 6];
            const mejor = mejorLargo(largo, ancho, orientacion, longitudes);
            const { C, tables, reqLen, N, waste, totalNeeded } = mejor;
            const wastePct = totalNeeded > 0 ? (waste / totalNeeded * 100).toFixed(2) : 0;

            const perimetro = 2 * (largo + ancho);
            const borde = Math.ceil(perimetro / 3);
            const h = calcularPerfilH(largo, ancho, orientacion, C, reqLen);

            // Soleras: 
            // Paralelo al CORTO: lado CORTO × 2 / 2.6
            // Paralelo al LARGO: lado LARGO × 2 / 2.6
            let soleras;
            if (orientacion === 'corto') {
                soleras = Math.ceil((ancho * 2) / 2.6);
            } else {
                soleras = Math.ceil((largo * 2) / 2.6);
            }

            const montantes = calcularMontantes(largo, ancho, orientacion);
            const area = largo * ancho;
            const baseTyT = area + 4 * soleras;
            const t8 = roundUp50(baseTyT);
            const tarugos = roundUp50(baseTyT);

            const paso1_t1 = 6 * montantes;
            const paso2_t1 = (tables * C) / 0.4;
            const t1 = roundUp50(paso1_t1 + paso2_t1);

            let codigoPlaca, descPlaca;
            if (color) {
                codigoPlaca = C === 4 ? '185' : '186';
                descPlaca = articulos[codigoPlaca];
            } else {
                codigoPlaca = { 4: '954', 5: '955', 6: '956' }[C] || '956';
                descPlaca = articulos[codigoPlaca];
            }

            return {
                orientacion,
                color,
                C,
                tables,
                codigoPlaca,
                descPlaca,
                borde,
                h,
                soleras,
                montantes,
                t8,
                tarugos,
                t1,
                wastePct,
                area,
                largo,
                ancho
            };
        }

        /**
         * Cálculo de lana de vidrio
         */
        function calcularLana(area) {
            if (area > 29) {
                return { codigo: '876602', desc: articulos['876602'], cantidad: Math.ceil(area / 24) };
            }
            const r50 = Math.ceil(area / 24), w50 = r50 * 24 - area;
            const r70 = Math.ceil(area / 14.4), w70 = r70 * 14.4 - area;
            return w50 <= w70
                ? { codigo: '876602', desc: articulos['876602'], cantidad: r50 }
                : { codigo: '876604', desc: articulos['876604'], cantidad: r70 };
        }

        // ==================== SUMA DE MÚLTIPLES CIELORRASOS ====================
        function sumarMateriales(listaResultados) {
            const total = {};
            let areaTotal = 0;
            let totalNeededGlobal = 0;
            let wasteTotal = 0;

            listaResultados.forEach(res => {
                areaTotal += res.area;
                totalNeededGlobal += res.tables * res.C * 0.20;
                wasteTotal += (res.tables * res.C * 0.20) - res.area;

                const items = [
                    { cod: res.codigoPlaca, cant: res.tables, desc: res.descPlaca },
                    { cod: res.color ? '187' : '953', cant: res.borde, desc: articulos[res.color ? '187' : '953'] },
                    { cod: res.color ? '1398' : '957', cant: res.h || 0, desc: articulos[res.color ? '1398' : '957'] },
                    { cod: '545', cant: res.soleras, desc: articulos['545'] },
                    { cod: '67', cant: res.montantes, desc: articulos['67'] },
                    { cod: 't8', cant: res.t8, desc: articulos['t8'] },
                    { cod: '1157', cant: res.tarugos, desc: articulos['1157'] },
                    { cod: 't1', cant: res.t1, desc: articulos['t1'] }
                ];

                items.forEach(item => {
                    if (item.cant > 0) {
                        if (!total[item.cod]) total[item.cod] = { cant: 0, desc: item.desc };
                        total[item.cod].cant += item.cant;
                    }
                });
            });

            const wastePctGlobal = totalNeededGlobal > 0 ? ((wasteTotal / totalNeededGlobal) * 100).toFixed(2) : 0;
            return { total, areaTotal, wastePctGlobal };
        }

        // ==================== PARSEO DE MEDIDAS ====================
        function parsearMedidas(input) {
            const tieneMultiples = /[+\-]/.test(input);

            if (!tieneMultiples) {
                const nums = input.split(/[^\d.,]+/).filter(s => s).map(s => parseFloat(s.replace(',', '.')));
                if (nums.length < 2) return { error: 'Ingrese dos medidas válidas' };
                const [a, b] = nums;
                if (isNaN(a) || isNaN(b)) return { error: 'Medidas inválidas' };
                return {
                    multiple: false,
                    cielorrasos: [{ largo: Math.max(a, b), ancho: Math.min(a, b) }]
                };
            }

            const partes = input.split(/[+\-]+/).filter(p => p.trim());
            const cielorrasos = [];

            for (let parte of partes) {
                const nums = parte.trim().split(/[^\d.,]+/).filter(s => s).map(s => parseFloat(s.replace(',', '.')));
                if (nums.length >= 2) {
                    const [a, b] = nums;
                    if (!isNaN(a) && !isNaN(b)) {
                        cielorrasos.push({ largo: Math.max(a, b), ancho: Math.min(a, b) });
                    }
                }
            }

            if (cielorrasos.length === 0) return { error: 'No se pudieron interpretar las medidas' };
            return { multiple: cielorrasos.length > 1, cielorrasos };
        }

        // ==================== INTERFAZ ====================
        function crearTarjeta(result, idSufijo) {
            const div = document.createElement('div');
            div.className = 'card';
            div.id = `card-${idSufijo}`;
            
            const titulo = result.orientacion === 'corto'
                ? 'Paralelo al lado más corto'
                : 'Paralelo al lado más largo';
            const colorText = result.color ? ' · color' : '';
            const h2Class = result.orientacion === 'corto' ? 'corto' : 'largo';

            div.innerHTML = `
                <div class="ceiling-info">
                    <strong>Medidas:</strong> ${result.largo}m × ${result.ancho}m &nbsp;|&nbsp; 
                    <strong>Superficie:</strong> ${result.area.toFixed(2)} m² &nbsp;|&nbsp;
                    <strong>Tablas:</strong> ${result.tables} × ${result.C}m
                </div>
                <h2 class="${h2Class}">${titulo}${colorText}</h2>
                <ul class="material-list">
                    <li><strong>${result.tables}</strong> <span class="cod">${result.codigoPlaca}</span> ${result.descPlaca}</li>
                    <li><strong>${result.borde}</strong> <span class="cod">${result.color ? '187' : '953'}</span> ${articulos[result.color ? '187' : '953']}</li>
                    ${result.h ? `<li><strong>${result.h}</strong> <span class="cod">${result.color ? '1398' : '957'}</span> ${articulos[result.color ? '1398' : '957']}</li>` : ''}
                    <li><strong>${result.soleras}</strong> <span class="cod">545</span> ${articulos['545']}</li>
                    <li><strong>${result.montantes}</strong> <span class="cod">67</span> ${articulos['67']}</li>
                    <li><strong>${result.t8}</strong> <span class="cod">t8</span> ${articulos['t8']}</li>
                    <li><strong>${result.tarugos}</strong> <span class="cod">1157</span> ${articulos['1157']}</li>
                    <li><strong>${result.t1}</strong> <span class="cod">t1</span> ${articulos['t1']}</li>
                </ul>
                <div class="waste">Desperdicio PVC: ${result.wastePct}%</div>
                <div class="btn-opc">
                    <button class="btn-lana" data-id="${idSufijo}">+ Aislación térmica</button>
                    <button class="btn-color" data-id="${idSufijo}">+ PVC color</button>
                </div>
                <div id="opcional-${idSufijo}" class="opcional"></div>
            `;
            return div;
        }

        function crearTarjetaTotal(totalData, numCielorrasos, orientacion) {
            const div = document.createElement('div');
            div.className = 'total-consolidado';

            let itemsHTML = '';
            Object.entries(totalData.total).forEach(([cod, data]) => {
                if (data.cant > 0) {
                    itemsHTML += `<li><strong>${Math.round(data.cant)}</strong> <span class="cod">${cod}</span> ${data.desc}</li>`;
                }
            });

            const textoOrientacion = orientacion === 'corto' ? 'Paralelo al lado más corto' : 'Paralelo al lado más largo';

            div.innerHTML = `
                <h3>📦 Total consolidado</h3>
                <div class="ceiling-info">
                    <strong>${numCielorrasos} cielorraso${numCielorrasos > 1 ? 's' : ''}</strong> &nbsp;|&nbsp; 
                    <strong>${textoOrientacion}</strong> &nbsp;|&nbsp; 
                    <strong>Superficie total:</strong> ${totalData.areaTotal.toFixed(2)} m²
                </div>
                <ul class="material-list">
                    ${itemsHTML}
                </ul>
                <div class="waste">Desperdicio promedio PVC: ${totalData.wastePctGlobal}%</div>
            `;
            return div;
        }

        // ==================== EJECUCIÓN DE CÁLCULO ====================
        function ejecutarCalculo(orientacion) {
            estadoCalculo.orientacionSeleccionada = orientacion;
            const contenedor = document.getElementById('resultados');
            const totalDiv = document.getElementById('totalConsolidado');
            contenedor.innerHTML = '';
            totalDiv.innerHTML = '';

            // Calcular cada cielorraso con la orientación seleccionada
            const resultados = estadoCalculo.cielorrasos.map((c, idx) =>
                calcularMateriales(c.largo, c.ancho, orientacion, false)
            );

            // Mostrar aviso si es múltiple
            if (estadoCalculo.esMultiple) {
                const notice = document.createElement('div');
                notice.className = 'multiple-notice';
                notice.style.cssText = 'flex: 1 1 100%;';
                notice.innerHTML = `<strong>📋 ${estadoCalculo.cielorrasos.length} cielorrasos detectados.</strong> Los resultados se muestran por separado y el total consolidado al final.`;
                contenedor.appendChild(notice);
            }

            // Mostrar tarjetas individuales
            resultados.forEach((res, idx) => {
                contenedor.appendChild(crearTarjeta(res, `c${idx + 1}`));
            });

            // Mostrar total consolidado si hay múltiples
            if (estadoCalculo.esMultiple) {
                const total = sumarMateriales(resultados);
                totalDiv.appendChild(crearTarjetaTotal(total, estadoCalculo.cielorrasos.length, orientacion));
            }

            // Actualizar estado de botones
            document.getElementById('btnCorto').classList.toggle('active', orientacion === 'corto');
            document.getElementById('btnLargo').classList.toggle('active', orientacion === 'largo');
        }

        // ==================== EVENTOS ====================
        document.getElementById('calcular').addEventListener('click', function () {
            const input = document.getElementById('medidas').value.trim();
            if (!input) { alert('Ingrese medidas'); return; }

            const resultado = parsearMedidas(input);
            if (resultado.error) { alert(resultado.error); return; }

            // Guardar estado
            estadoCalculo.cielorrasos = resultado.cielorrasos;
            estadoCalculo.esMultiple = resultado.multiple;
            estadoCalculo.orientacionSeleccionada = null;

            // Mostrar selector de orientación
            document.getElementById('orientationSelector').classList.add('visible');
            document.getElementById('resultados').innerHTML = '';
            document.getElementById('totalConsolidado').innerHTML = '';

            // Resetear botones
            document.getElementById('btnCorto').classList.remove('active');
            document.getElementById('btnLargo').classList.remove('active');
        });

        // Botones de orientación
        document.getElementById('btnCorto').addEventListener('click', () => ejecutarCalculo('corto'));
        document.getElementById('btnLargo').addEventListener('click', () => ejecutarCalculo('largo'));

        // Opcionales (lana/color) - delegación de eventos
        document.getElementById('resultados').addEventListener('click', function (e) {
            const target = e.target;
            if (!target.classList.contains('btn-lana') && !target.classList.contains('btn-color')) return;

            const id = target.dataset.id;
            const card = document.getElementById(`card-${id}`);
            const opcionalDiv = document.getElementById(`opcional-${id}`);

            // Obtener medidas del cielorraso correspondiente
            const idx = parseInt(id.replace('c', '')) - 1;
            const c = estadoCalculo.cielorrasos[idx];
            if (!c) return;

            if (target.classList.contains('btn-lana')) {
                const lana = calcularLana(c.largo * c.ancho);
                opcionalDiv.innerHTML = `
                    <h4>Aislación térmica agregada</h4>
                    <ul class="material-list">
                        <li><strong>${lana.cantidad}</strong> <span class="cod">${lana.codigo}</span> ${lana.desc}</li>
                    </ul>
                `;
            } else if (target.classList.contains('btn-color')) {
                const resColor = calcularMateriales(c.largo, c.ancho, estadoCalculo.orientacionSeleccionada, true);
                const lista = card.querySelector('.material-list');
                
                // Actualizar tabla PVC
                lista.children[0].innerHTML = `<strong>${resColor.tables}</strong> <span class="cod">${resColor.codigoPlaca}</span> ${resColor.descPlaca}`;
                
                // Actualizar perfil borde
                lista.children[1].innerHTML = `<strong>${resColor.borde}</strong> <span class="cod">187</span> ${articulos['187']}`;

                // Manejar perfil H
                const unionIndex = Array.from(lista.children).findIndex(li => li.innerHTML.includes('UNION'));
                
                if (resColor.h) {
                    const newLi = document.createElement('li');
                    newLi.innerHTML = `<strong>${resColor.h}</strong> <span class="cod">1398</span> ${articulos['1398']}`;
                    
                    if (unionIndex >= 0) {
                        lista.children[unionIndex].innerHTML = `<strong>${resColor.h}</strong> <span class="cod">1398</span> ${articulos['1398']}`;
                    } else {
                        lista.insertBefore(newLi, lista.children[2]);
                    }
                } else if (unionIndex >= 0) {
                    lista.removeChild(lista.children[unionIndex]);
                }

                card.querySelector('.waste').textContent = `Desperdicio PVC: ${resColor.wastePct}%`;
                opcionalDiv.innerHTML = '';
            }
        });
    </script>
</body>

</html>
